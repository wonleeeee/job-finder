# 자율성 정책 — 되돌릴 수 없는 행동을 얼마나 위임할지
#
# 정본은 Notion "Settings" 페이지의 ```yaml 코드 블록이다 (2026-10-21 부터).
# 프로비저닝 때 이 파일을 그 블록으로 올리고, 이후 수정은 Notion 에서 한다.
# /sync 가 그 블록을 data/cache/autonomy.yaml 로 내려주고 에이전트는 캐시를 읽는다.
# 캐시를 직접 고치지 않는다 — 다음 /sync 에서 덮인다.
# 기본값은 언제나 안전한 쪽이다. 신뢰가 쌓이면 사용자가 직접 올린다.

# ── 파이프라인 단계별 ────────────────────────────────────────
discover:     auto        # 공고 발굴 — 항상 무인
propose:      weekly      # 브리핑 주기: daily | weekly | biweekly
approve:      user        # ⛔ 절대 자동화하지 않음. 승인 게이트의 존재 이유
tailor:       auto        # 승인되면 즉시 무인 튜닝

submit:       confirm     # ★ manual | confirm | delegated
                          #   manual    키트까지만. 제출은 언제나 사람
                          #   confirm   폼을 다 채우고 제출 직전 확인 요청 (기본)
                          #   delegated 승인 시점에 제출까지 위임. 완전 무인

email_reply:  confirm     # draft-only | confirm | delegated
schedule:     confirm     # 면접 일정 회신
terminal:     user        # 오퍼/탈락/철회 전이는 항상 사람

# ── 브리핑 ───────────────────────────────────────────────────
brief:
  day: monday
  hour: 8
  max_proposals: 10       # 한 브리핑에 올릴 신규 후보 상한
                          # 이걸 넘기면 사용자의 10분이 깨진다

# ── 스윕 ─────────────────────────────────────────────────────
sweep:
  hour: 3
  max_raw_candidates: 30  # 세션당 원시 후보 상한
  min_score: 40           # 이 아래는 저장하지 않는다
  discovered_ttl_days: 30 # 승격 안 되면 정리 (Stable ID만 남김)

# ── 정체 판정 ────────────────────────────────────────────────
stale:
  followup_days: 10       # 무응답 며칠 후 후속 제안
  ghost_days: 14          # 무응답 며칠 후 ghosted 제안 (자동 전이 아님)

# ── 지원 폼 상용 답변 ────────────────────────────────────────
# applicator 가 제출 키트의 "자주 묻는 질문" 표를 이걸로 채운다.
# 매번 똑같이 묻는 것들이라 미리 채워두면 사용자의 3~5분이 진짜 3~5분에 끝난다.
form_answers:
  desired_salary: "협의 가능 — 시장 수준 기준"
  earliest_start: "오퍼 수락 후 4주"
  requires_sponsorship: false
  willing_to_relocate: false
  how_did_you_hear: "회사 채용 페이지"
  reference_contact: ""

# ── 백업 ─────────────────────────────────────────────────────
backup:
  path: ""                # 예: C:/Users/<you>/OneDrive/job-finder-backups
                          # /backup 의 선택적 오프라인 zip (캐시 + Resume Versions Current 첨부)과
                          # 원격 마이그레이션 전 덤프가 여기로 간다.
                          # 1차 백업은 Notion 자체(페이지 이력 · 버전 행)다. 다기기는 포인터 파일 + /sync 로 해결된다
  keep: 10

# ── 아웃리치 (LinkedIn 아웃바운드) ──────────────────────────────
# 내가 먼저 연락한다. 사용자의 실제 LinkedIn 계정·이름으로 나가는 말이므로
# submit 보다 보수적으로 시작한다. outreach 에이전트가 읽는다.
outreach:
  mode: confirm             # draft | confirm | delegated
                            #   draft      사람 찾기 + 초안까지. 브라우저로 발송 화면을 열지 않음
                            #   confirm    Connect → Add a note → 입력까지. Send 는 사람이 누름 (기본)
                            #   delegated  승인된 큐 항목은 Send 까지. 상한·시간대는 그대로
                            # ⚠ LinkedIn 약관은 자동화 도구를 금지한다. delegated 로 올리는 결정은
                            #   사용자가 위험을 알고 내린다. 에이전트는 제안하지 않는다.
  approval: per_item        # 건별 승인만. by_policy 는 아웃리치에 허용하지 않는다
  min_score: 70             # 이 점수 이상 공고에만 사람을 붙인다
  lanes: [conviction]       # 아웃리치를 붙이는 레인
  people_per_job: 3         # 공고당 최대 후보 수
  caps:
    per_day: 4              # 하루 발송 상한 (연결 요청 + 메시지 합산)
    per_week: 12            # 주간 발송 상한. LinkedIn 초대 상한보다 훨씬 아래에 둔다
    per_company_per_req: 2  # 같은 공고에 2명까지
    profile_views_per_session: 20
    follow_ups: 1           # 후속은 한 번만
  hours: "09:00-18:00"      # 사용자 현지 시각. 밖에서는 발송하지 않는다 (새벽 크론 금지)
  weekdays_only: true
  follow_up_days: 7         # 무응답 후속까지 일수
  cold_after_days: 14       # 후속 뒤 이 기간 무응답이면 Cold 유지, Next touch 비움
  angles: [posting, korean, alumni, domain, mutual]   # schemas/contract.json outreach_angle
  first_message_mentions_visa: false   # 불변식 outreach-first-message-no-visa
  inmail: false             # InMail 크레딧 사용 금지 (명시 허용 전)
  network: home_only        # 사내 프록시에서 메시지함 미검증 — 집 PC 에서만
  reply_handling: draft-only  # 답장 회신은 초안만. 발송은 사용자 (email_reply 와 같은 급)
  templates: templates/outreach/messages.md
  queue: notion:Outreach Queue    # data/notion_databases.json → databases.outreach_queue. 행=사람×공고×kind, 본문=초안
  identity:                 # 메시지·검색에 쓰는 내 정보. 엔진(공개 레포)에 두지 않고 여기에만 둔다
    signoff: ""              # 서명 (예: 이름 한 단어)
    metro: ""                # LinkedIn 검색 지역 · 자기소개 지역 (예: Atlanta)
    intro_en: ""             # 연결 요청 자기소개 구절 (예: a backend engineer in <metro>)
    intro_ko: ""             # korean 각도 자기소개 (예: <지역>에서 {도메인} 백엔드를 하고 있는 <이름>)
    heritage:               # korean 각도 — 같은 출신·모국어 상대. 쓰지 않으면 angles 에서 korean 을 뺀다
      label: ""
      language: ""
    schools: []             # alumni 각도
    domain_line: ""          # domain 각도 첫 문장
    domains: []             # domain 각도 · 따뜻한 연결고리 검색 키워드
    evidence: []            # 본 메시지 증거 후보 — 마스터 이력서 불릿 id
    evidence_extra: []      # id 없는 증거 (짧은 구절)
    evidence_ai: []         # AI 각도일 때만 쓰는 증거 id
    banned_claims: []       # 폐기한 수치·주장 — 쓰지 않는다
